#
# cross500 — the same four axes as `main`, crossed MORE (scaling scenario).
#
# Target: ~500 instances.  Exact: 500 = 375 base + 120 quantized + 5 abliterated.
#   375 base       = 25 base models × 15 variations (temp[0.4,0.6,0.8]×sp[-1,0,3,6,7])
#   120 quantized  =  4 quant base models × 30 variations
#                    (temp[0.4,0.6,0.8]×sp[-1,0,3,6,7] crossed over {fp8, bitsandbytes_int4})
#     5 abliterated = 5 data-backed repos, pinned temp=1.0 / sp=-1 (NOT crossed)
#
# Only real temperatures/system-prompt indices are used here (all values appear
# in the released data grid), but the cartesian crossing is wider than `main`'s.
# Abliteration is never crossed beyond the pinned (1.0, -1) cell — no released
# data exists for any other abliterated cell, and the loader rejects such cells.

name: cross500

base_models:
  - CohereForAI/c4ai-command-r-plus
  - CohereForAI/c4ai-command-r-v01
  - CohereLabs/aya-23-35B
  - CohereLabs/aya-23-8B
  - HuggingFaceH4/zephyr-7b-beta
  - NousResearch/Nous-Hermes-2-Mixtral-8x7B-DPO
  - Qwen/Qwen2-1.5B-Instruct
  - Qwen/Qwen2-7B-Instruct
  - Qwen/Qwen2-72B-Instruct
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - abacusai/Smaug-Llama-3-70B-Instruct
  - google/gemma-2-9b-it
  - google/gemma-2-27b-it
  - gradientai/Llama-3-8B-Instruct-Gradient-1048k
  - meta-llama/Meta-Llama-3-8B-Instruct
  - meta-llama/Llama-3.1-8B-Instruct
  - meta-llama/Meta-Llama-3.1-70B-Instruct
  - microsoft/Phi-3-mini-4k-instruct
  - microsoft/Phi-3-mini-128k-instruct
  - microsoft/Phi-3-medium-4k-instruct
  - microsoft/Phi-3-medium-128k-instruct
  - mistralai/Mistral-7B-Instruct-v0.1
  - mistralai/Mistral-7B-Instruct-v0.2
  - mistralai/Mistral-7B-Instruct-v0.3
  - upstage/SOLAR-10.7B-Instruct-v1.0

base_variations:
  - {temperature: [0.4, 0.6, 0.8], system_prompt_idx: [-1, 0, 3, 6, 7]}

quantized_base_models:
  - Qwen/Qwen2-7B-Instruct
  - meta-llama/Meta-Llama-3-8B-Instruct
  - microsoft/Phi-3-mini-4k-instruct
  - mistralai/Mistral-7B-Instruct-v0.3

quantized_variations:
  - {temperature: [0.4, 0.6, 0.8], system_prompt_idx: [-1, 0, 3, 6, 7], quantization: [fp8, bitsandbytes_int4]}

abliterated_models:
  - failspy/Meta-Llama-3-8B-Instruct-abliterated-v3
  - failspy/Smaug-Llama-3-70B-Instruct-abliterated-v3
  - natong19/Qwen2-7B-Instruct-abliterated
  - failspy/Phi-3-medium-4k-instruct-abliterated-v3
  - dphn/dolphin-2.9.2-Phi-3-Medium-abliterated

abliteration_variations:
  - {temperature: [1.0], system_prompt_idx: [-1]}
