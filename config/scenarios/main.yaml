#
# main — the FLIPS paper default scenario.
#
# Enumerates EXACTLY 237 classification instances:
#   200 base       = 25 base models × 8 base variations
#                    (temp[0.4,0.6,0.8,1.0]×sp[-1]  ∪  temp[1.0]×sp[0,3,6,7])
#    32 quantized  =  4 quant base models × 2 quant levels × 4 variations
#                    (temp[0.6,1.0]×sp[-1]  ∪  temp[1.0]×sp[0,3])  crossed over {fp8, bitsandbytes_int4}
#     5 abliterated = 5 data-backed abliterated repos, pinned temp=1.0 / sp=-1
#   ------------------------------------------------------------------------
#   237 total
#
# The variation grids are ported verbatim from the historical run config
# XP_configs/e1_closedset_headline/FLIPS_mix_tp_full.yaml
# (`model_variations` + `quantized_model_variations`). The model lists are the
# canonical model universe declared in config/models.yaml.
#
# Abliteration list — 5 not 6.
#   The source config's `abliterated_models` lists SIX repos. The sixth,
#       failspy/Phi-3-mini-128k-instruct-abliterated-v3
#   is config-listed but ABSENT from the released model universe (no data was
#   ever generated for it). main.yaml therefore lists only the 5 data-backed
#   repos, so the offline build self-consistently lands on 237 with NO
#   data-universe filter needed. (The 200 base + 5 abliterated labels here tie
#   EXACTLY to the released 205-class identity in
#   XP_configs/e3_flips_vs_llmmap/llmmap_if_data/checkpoint_dir/new_var_models_idx.json
#   — asserted by tests/test_main_scenario_237.py.)

name: main

# 25 base LLMs (the config/models.yaml base_models universe) × 8 variations = 200.
base_models:
  - CohereForAI/c4ai-command-r-plus
  - CohereForAI/c4ai-command-r-v01
  - CohereLabs/aya-23-35B
  - CohereLabs/aya-23-8B
  - HuggingFaceH4/zephyr-7b-beta
  - NousResearch/Nous-Hermes-2-Mixtral-8x7B-DPO
  - Qwen/Qwen2-1.5B-Instruct
  - Qwen/Qwen2-7B-Instruct
  - Qwen/Qwen2-72B-Instruct
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  - abacusai/Smaug-Llama-3-70B-Instruct
  - google/gemma-2-9b-it
  - google/gemma-2-27b-it
  - gradientai/Llama-3-8B-Instruct-Gradient-1048k
  - meta-llama/Meta-Llama-3-8B-Instruct
  - meta-llama/Llama-3.1-8B-Instruct
  - meta-llama/Meta-Llama-3.1-70B-Instruct
  - microsoft/Phi-3-mini-4k-instruct
  - microsoft/Phi-3-mini-128k-instruct
  - microsoft/Phi-3-medium-4k-instruct
  - microsoft/Phi-3-medium-128k-instruct
  - mistralai/Mistral-7B-Instruct-v0.1
  - mistralai/Mistral-7B-Instruct-v0.2
  - mistralai/Mistral-7B-Instruct-v0.3
  - upstage/SOLAR-10.7B-Instruct-v1.0

base_variations:
  - {temperature: [0.4, 0.6, 0.8, 1.0], system_prompt_idx: [-1]}
  - {temperature: [1.0], system_prompt_idx: [0, 3, 6, 7]}

# 4 quantized base models × {fp8, bitsandbytes_int4} × 4 variations = 32.
quantized_base_models:
  - Qwen/Qwen2-7B-Instruct
  - meta-llama/Meta-Llama-3-8B-Instruct
  - microsoft/Phi-3-mini-4k-instruct
  - mistralai/Mistral-7B-Instruct-v0.3

quantized_variations:
  - {temperature: [0.6, 1.0], system_prompt_idx: [-1], quantization: [fp8, bitsandbytes_int4]}
  - {temperature: [1.0], system_prompt_idx: [0, 3], quantization: [fp8, bitsandbytes_int4]}

# 5 data-backed abliterated repos, pinned to the paper default (temp=1.0, sp=-1).
abliterated_models:
  - failspy/Meta-Llama-3-8B-Instruct-abliterated-v3
  - failspy/Smaug-Llama-3-70B-Instruct-abliterated-v3
  - natong19/Qwen2-7B-Instruct-abliterated
  - failspy/Phi-3-medium-4k-instruct-abliterated-v3
  - dphn/dolphin-2.9.2-Phi-3-Medium-abliterated

abliteration_variations:
  - {temperature: [1.0], system_prompt_idx: [-1]}
