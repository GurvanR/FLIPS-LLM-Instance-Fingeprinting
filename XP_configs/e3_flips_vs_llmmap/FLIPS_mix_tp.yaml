# Wrapper config to regenerate the F01 superposition figure (3 curves: FLiPS Closed-set,
# FLiPS Open-set, LLMmap-IF) from existing train_size_checkpoints — no re-classification.
#
# The 3 curves are read directly from the paths in `train_size_dict_map` below: the two
# FLiPS arms from THIS run's FLATTENED closed/open-set checkpoints under
# Productions/FLiPS_ICML_run/Experiments/ (so run AFTER repro-closedset + repro-openset),
# and the LLMmap arm from the committed in-repo cache (no Productions/LLMmap_ICML_run/ needed).
# Run via `make repro-comparison` (--xp-suffix comparison) or `make repro-headline`.
#
# Source for mirrored fields: the closed-set headline config (e1_closedset_headline).

experiment_fun: Batch_Classification_across_token_pairs
include_quantized: []
# Omitted -> schema defaults (src/audit_llm/experiment_config_schema.py): features=SmallNist, alpha=0.05, min_seq_length=100.
PRNGs: None  # Has to be none within LLMmap xp
models: []
token_pairs: ['0-1', 'ORY-child', 'way-ither', 'isan-Provider', 'ali-yg', 'awk-ise', 'City-load', 'crit-SA', 'df-bits', 'distance-Menu']

sampling_parameters:
  system_prompt_idx: []
  temperature: []
  frequency_penalty: [0.0]

model_variations: [
  {'temperature': [0.4, 0.6, 0.8, 1.0], 'system_prompt_idx': [-1]},
  {'temperature': [1.0], 'system_prompt_idx': [0, 3, 6, 7]},
]

quantized_model_variations: [
  {'temperature': [0.6, 1.0], 'system_prompt_idx': [-1]},
  {'temperature': [1.0], 'system_prompt_idx': [0, 3]},
]

abliterated_models: [
    "failspy/Meta-Llama-3-8B-Instruct-abliterated-v3",
    "failspy/Smaug-Llama-3-70B-Instruct-abliterated-v3",
    "natong19/Qwen2-7B-Instruct-abliterated",
    "failspy/Phi-3-medium-4k-instruct-abliterated-v3",
    "dphn/dolphin-2.9.2-Phi-3-Medium-abliterated",
    "failspy/Phi-3-mini-128k-instruct-abliterated-v3"
]

calculations:
  token_pairs: token_pairs

train_sizes: [40]

classification_config:
  # ORDER MATTERS for curve colors. plot_group_curves picks colors by iteration index
  # from all_colors = ["red", "#4daf4a", "#984ea3", ...] at
  # src/audit_llm/Classification/training_size_analysis.py:729
  # So: 1st entry → red, 2nd → green, 3rd → purple (#984ea3, the historical LLMmap-IF color).
  #
  # Label substring rules (load-bearing — do not change wording):
  #   - "Open-set"  → triggers Unseen-label injection (training_size_analysis.py:234)
  #   - "LLMmap"    → triggers LLMmap dispatch branch (training_size_analysis.py:735)
  #   - "FLiPS"     → triggers FLiPS dispatch branch (training_size_analysis.py:761, case-insensitive)
  train_size_dict_map: {
    "Productions/FLiPS_ICML_run/Experiments/Batch_Classification_across_token_pairs/FLIPS_mix_tp_full_closedset/ClosedSet/train_size_checkpoints": "FLIPS (Closed-set)",
    "Productions/FLiPS_ICML_run/Experiments/Batch_Classification_across_token_pairs/FLIPS_mix_tp_full_openset/OpenSet/alpha_0_05/train_size_checkpoints": "FLIPS (Open-set)",
    # LLMmap-IF source: slim hardcoded values baked into the repo alongside this YAML,
    # so the figure can be regenerated on any server without syncing Productions/LLMmap_ICML_run/.
    # Built by scripts/misc_scripts/merge_llmmap_sub_runs_results.py (merges 4 sub-runs covering
    # bs pairs, applies LLMmap above-mean accuracy filter), then trimmed to F01-relevant keys.
    # Path is relative to repo root — run_experiments.py sets cwd to repo root.
    "XP_configs/e3_flips_vs_llmmap/llmmap_if_data/ClosedSet/train_size_checkpoints": "LLMmap-IF",
  }

  # Omitted -> schema defaults: splitter_type=StratifiedShuffleSplit, default_normalization=auto,
  # normalization_methods={seq_length: none}, store_prediction_probas=true, compute_micro_pr_curve=true,
  # unique_tp_in_mix=['max'].
  compute_confusion_matrices: true  # non-default: this wrapper draws the F01 confusion heatmaps
  classifiers:
    - XGBoost

  n_splits: 2
  test_size: 64

  classifier_metrics: ['accuracy']
  batch_prediction_sizes: [1, 2, 3, 4, 5, 6, 7, 8]
  # Only mix_tp_at_pred — F01 uses mix_tp_at_pred for bs>1 FLiPS curves;
  # bs=1 auto-falls back to tp_wise via the `bs == 1` guard in plot_group_curves.
  # Listing tp_wise here too would overwrite the F01 PDF (same path/name) with the tp_wise version.
  batch_types: ['mix_tp_at_pred']
  openset: false
  m_test_size: 5
  openset_m_splits: 10

  max_nb_of_uplet: 5
