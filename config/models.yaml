# Model registry for FLIPS - the model-universe source of truth.
#
# Every model is addressed by its Hugging Face Hub id and resolves through the
# standard Hugging Face cache. There are deliberately NO cluster filesystem
# paths in this file. Cluster users overlay paths in config/models.hpc.example.yaml
# (see AUDIT_LLM_MODEL_CACHE in docs/codebase/conventions.md).

_metadata:
  schema_version: 1
  description: >-
    The 25 base LLMs benchmarked in the FLIPS paper plus their quantized and
    abliterated variants, addressed by Hugging Face Hub id. Consumed by the
    analysis-layer instance enumerator as the canonical model universe.
  paper_doi: "10.0000/PLACEHOLDER"  # TODO: set to the Zenodo/paper DOI on release

# 25 base LLMs (cross-checked against the historical model inventory).
base_models:
  # Cohere
  - CohereForAI/c4ai-command-r-plus
  - CohereForAI/c4ai-command-r-v01
  - CohereLabs/aya-23-35B
  - CohereLabs/aya-23-8B
  # HuggingFace H4
  - HuggingFaceH4/zephyr-7b-beta
  # Nous Research
  - NousResearch/Nous-Hermes-2-Mixtral-8x7B-DPO
  # Qwen
  - Qwen/Qwen2-1.5B-Instruct
  - Qwen/Qwen2-7B-Instruct
  - Qwen/Qwen2-72B-Instruct
  - Qwen/Qwen3-30B-A3B-Instruct-2507
  # Abacus AI
  - abacusai/Smaug-Llama-3-70B-Instruct
  # Google
  - google/gemma-2-9b-it
  - google/gemma-2-27b-it
  # Gradient AI
  - gradientai/Llama-3-8B-Instruct-Gradient-1048k
  # Meta
  - meta-llama/Meta-Llama-3-8B-Instruct
  - meta-llama/Llama-3.1-8B-Instruct
  - meta-llama/Meta-Llama-3.1-70B-Instruct
  # Microsoft
  - microsoft/Phi-3-mini-4k-instruct
  - microsoft/Phi-3-mini-128k-instruct
  - microsoft/Phi-3-medium-4k-instruct
  - microsoft/Phi-3-medium-128k-instruct
  # Mistral AI
  - mistralai/Mistral-7B-Instruct-v0.1
  - mistralai/Mistral-7B-Instruct-v0.2
  - mistralai/Mistral-7B-Instruct-v0.3
  # Upstage
  - upstage/SOLAR-10.7B-Instruct-v1.0

# Quantized variants: 4 base models x {fp8, bitsandbytes_int4} = 8.
# The 'alias' encodes the variant with the "@@" QUANTIZATION_SEPARATOR used by
# audit_llm.file_io.get_base_model_name / get_quantization_suffix.
quantized_variants:
  - base: Qwen/Qwen2-7B-Instruct
    quantization: fp8
    alias: "Qwen/Qwen2-7B-Instruct@@fp8"
  - base: Qwen/Qwen2-7B-Instruct
    quantization: bitsandbytes_int4
    alias: "Qwen/Qwen2-7B-Instruct@@bitsandbytes_int4"
  - base: meta-llama/Meta-Llama-3-8B-Instruct
    quantization: fp8
    alias: "meta-llama/Meta-Llama-3-8B-Instruct@@fp8"
  - base: meta-llama/Meta-Llama-3-8B-Instruct
    quantization: bitsandbytes_int4
    alias: "meta-llama/Meta-Llama-3-8B-Instruct@@bitsandbytes_int4"
  - base: microsoft/Phi-3-mini-4k-instruct
    quantization: fp8
    alias: "microsoft/Phi-3-mini-4k-instruct@@fp8"
  - base: microsoft/Phi-3-mini-4k-instruct
    quantization: bitsandbytes_int4
    alias: "microsoft/Phi-3-mini-4k-instruct@@bitsandbytes_int4"
  - base: mistralai/Mistral-7B-Instruct-v0.3
    quantization: fp8
    alias: "mistralai/Mistral-7B-Instruct-v0.3@@fp8"
  - base: mistralai/Mistral-7B-Instruct-v0.3
    quantization: bitsandbytes_int4
    alias: "mistralai/Mistral-7B-Instruct-v0.3@@bitsandbytes_int4"

# Abliterated variants: 5 data-backed entries. The base -> abliterated_hf_id
# mapping is preserved verbatim from
# audit_llm.models_management.model_names.ABLITERATED_MODELS_MAP_TO_ORIGINAL
# (the mapping the released data was generated against). Abliterated instances
# are pinned to temperature=1.0 / system_prompt=-1 (the paper default; see
# xp_tools/data_preparation.py).
abliterated_variants:
  # NOTE: the abliterated repo name reads "Meta-Llama-3-8B" but the source maps
  # it to the 3.1-8B base; preserved verbatim from the SSOT.
  - base: meta-llama/Llama-3.1-8B-Instruct
    abliterated_hf_id: failspy/Meta-Llama-3-8B-Instruct-abliterated-v3
    pinned: {temperature: 1.0, system_prompt: -1}
  - base: abacusai/Smaug-Llama-3-70B-Instruct
    abliterated_hf_id: failspy/Smaug-Llama-3-70B-Instruct-abliterated-v3
    pinned: {temperature: 1.0, system_prompt: -1}
  - base: Qwen/Qwen2-7B-Instruct
    abliterated_hf_id: natong19/Qwen2-7B-Instruct-abliterated
    pinned: {temperature: 1.0, system_prompt: -1}
  - base: microsoft/Phi-3-medium-4k-instruct
    abliterated_hf_id: failspy/Phi-3-medium-4k-instruct-abliterated-v3
    pinned: {temperature: 1.0, system_prompt: -1}
  - base: microsoft/Phi-3-medium-128k-instruct
    abliterated_hf_id: dphn/dolphin-2.9.2-Phi-3-Medium-abliterated
    pinned: {temperature: 1.0, system_prompt: -1}
  # config-listed; absent from released data:
  # - base: microsoft/Phi-3-mini-128k-instruct
  #   abliterated_hf_id: failspy/Phi-3-mini-128k-instruct-abliterated-v3
  #   pinned: {temperature: 1.0, system_prompt: -1}
