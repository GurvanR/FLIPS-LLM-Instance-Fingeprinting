#
# example_custom — a minimal, runnable "build your own scenario" template.
#
# It SELECTS a 4-class subset (2 base models × 2 temperatures) from the data
# already shipped in Productions/FLiPS_ICML_light_subset/, so it runs on CPU with
# zero download. Copy this file to config/scenarios/<your_name>.yaml and edit the
# model list / variation grid to define your own scenario.
#
#   End-to-end walkthrough : docs/reproduction/custom-scenario.md
#   Field contract (axes, cartesian-within-a-group / union-across-groups,
#   validation rules, the CSV invariant) : config/scenarios/README.md
#   A fully-populated example (the 237-instance paper default) : main.yaml
#
# Two rules the loader enforces:
#   1. every base model MUST exist in config/models.yaml `base_models`;
#   2. every (model, temperature, system_prompt_idx) cell you select MUST have
#      been generated — otherwise that class has no data. Here we select the two
#      registered models present in the committed light subset, at temperatures
#      0.4 and 1.0, with no system prompt (sp=-1).

name: example_custom

# Two registered base models that are present in the committed light subset.
base_models:
  - CohereForAI/c4ai-command-r-plus
  - google/gemma-2-9b-it

# One group → 2 temperatures × 1 system-prompt cell = 2 variations per model.
# 2 base models × 2 variations = 4 classification classes.
base_variations:
  - {temperature: [0.4, 1.0], system_prompt_idx: [-1]}

# This template selects base models only. To grow your own scenario with
# quantized or abliterated instances, add the sibling sections (see main.yaml for
# a populated example and config/scenarios/README.md for the rules):
#
#   quantized_base_models:
#     - <a config/models.yaml quantized_variants base>
#   quantized_variations:
#     - {temperature: [...], system_prompt_idx: [...], quantization: [fp8, bitsandbytes_int4]}
#
#   abliterated_models:
#     - <a config/models.yaml abliterated_variants abliterated_hf_id>
#   abliteration_variations:
#     - {temperature: [1.0], system_prompt_idx: [-1]}   # abliteration is pinned to this cell
