[tool.poetry]
name = "flips"
version = "0.1"
description = "FLIPS: Instance-Fingerprinting for LLMs via Pseudo-random Sequences — reproducibility package (ICML 2026). Importable as `audit_llm` for historical compatibility."
authors = ["Pôle d'Expertise de la Régulation Numérique <contact@peren.gouv.fr>"]
license = "MIT"
# The distribution is named `flips`, but the importable package remains `audit_llm`
# for historical compatibility (existing imports, cached artifacts, and configs).
packages = [
    { include = "audit_llm", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.4.2"
pandas = "^3.0.0"
polars = "^1.38.1"
scipy = "^1.17.0"
scikit-learn = "^1.8.0"
joblib = "^1.5.3"
packaging = "^26.0"
pyyaml = "^6.0.3"
tqdm = "^4.67.3"
overrides = "^7.7.0"
matplotlib = "^3.9"
seaborn = "^0.13"
Pillow = "^11.0"
networkx = "^3.4"
xgboost = "^3.0"
umap-learn = "^0.5"
pyarrow = ">=10.0"

# GPU / generation (optional – install with: poetry install --extras generation)
torch = { version = "^2.5", optional = true }
transformers = { version = "^4.47", optional = true }
huggingface-hub = { version = "^0.27", optional = true }
openai = { version = "^1.60", optional = true }
pydantic = "^2.10"
pydantic-settings = "^2.7"
click = "^8.1"
ipywidgets = "^8.1.8"

[tool.poetry.extras]
generation = ["torch", "transformers", "huggingface-hub", "openai"]

[tool.poetry.group.dev.dependencies]
flake8 = "^7.2"
black = { extras = ["jupyter"], version = "^25.1" }
pylint = "^3.3"
pytest = "^8.3"
pytest-cov = "^6.1"
pre-commit = "^4.2"
licensecheck = "^2025.1"
reuse = "^5.0"
pyright = { extras = ["nodejs"], version = "^1.1" }
isort = "^6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120

[tool.licensecheck]
format = "ansi"
zero = true
# TODO[squelette]: Whitelist packages which have been reviewed and do not come with a license or
# that are incorrectly flagged as incompatible.
ignore_packages = [
    "pylint",  # GPL but used as an external tool (not imported)
    "reuse",  # Used as an external tool
]
ignore_licenses = [
  "MPL"  # See https://github.com/FHPythonUtils/LicenseCheck/issues/86
]

[tool.pylint.main]
fail-under = 9.0
output-format = "colorized"
# extension-pkg-allow-list = ["pydantic"]  # Uncomment if you use pydantic
load-plugins = [
#   "pylint_pydantic",  # Uncomment if you use pydantic
  "pylint.extensions.check_elif",
  "pylint.extensions.bad_builtin",
  "pylint.extensions.docparams",
  "pylint.extensions.for_any_all",
  "pylint.extensions.set_membership",
  "pylint.extensions.code_style",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.typing",
  "pylint.extensions.redefined_variable_type",
  "pylint.extensions.comparison_placement",
  "pylint.extensions.broad_try_clause",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.consider_refactoring_into_while_condition",
]
ignore = [".git", "__pycache__", ".venv", ".cache"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "R",  # refactor
  "C",  # convention
  "fixme",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s,%(msecs)03d:%(name)s:%(levelname)s:%(filename)s@%(lineno)s:%(message)s"
log_cli_date_format = "%F|%T"
markers = [
    "requires_data: test requires a downloaded Zenodo archive; skip when the data is absent",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  # Don't complain if tests don't hit defensive assertion code:
  "raise NotImplementedError",
  # Don't complain about abstract methods, they aren't run:
  "@(abc\\.)?abstractmethod",
  # Don't complain for main code:
  'if __name__ == "__main__":',
]

[tool.pyright]
# ref: https://github.com/microsoft/pyright/blob/main/docs/configuration.md
# TODO[squelette]: Uncomment the following line to activate strict type checking (recommended)
# typeCheckingMode = "strict"

[tool.isort]
profile = "black"
line_length = 120
no_lines_before = ["LOCALFOLDER"]
skip_gitignore = true
lines_after_imports = 2
